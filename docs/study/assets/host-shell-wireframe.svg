<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="공통 껍데기 호스트(host-vite / host-rspack) 3단 화면 아키텍처 와이어프레임">
  <defs>
    <style>
      .font-base { font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif; }
      .title-lg { font-size: 14px; font-weight: 700; fill: #1e293b; }
      .title-md { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .title-sm { font-size: 12px; font-weight: 700; fill: #334155; }
      .body-sm { font-size: 11px; font-weight: 500; fill: #475569; }
      .body-xs { font-size: 10.5px; font-weight: 500; fill: #64748b; }
      .badge-text { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .code-text { font-family: 'Consolas', 'D2Coding', ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #3730a3; }
    </style>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="960" height="660" rx="14" fill="#f8fafc" />

  <!-- 브라우저 외곽 프레임 -->
  <rect x="16" y="16" width="928" height="628" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- 브라우저 상단 주소창 -->
  <path d="M 16 28 Q 16 16 28 16 L 932 16 Q 944 16 944 28 L 944 54 L 16 54 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="38" cy="35" r="5.5" fill="#f87171" />
  <circle cx="56" cy="35" r="5.5" fill="#fbbf24" />
  <circle cx="74" cy="35" r="5.5" fill="#34d399" />
  <rect x="104" y="24" width="752" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="480" y="39" text-anchor="middle" class="font-base body-sm">App Shell (공통 껍데기 호스트)  —  http://localhost:3000 (host-vite)  |  http://localhost:3001 (host-rspack)</text>

  <!-- ===================================================================== -->
  <!-- 1단: HostHeader (글로벌 제어 헤더) -->
  <!-- ===================================================================== -->
  <rect x="34" y="70" width="892" height="84" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5" />
  <text x="50" y="92" class="font-base title-lg">1. HostHeader (글로벌 제어 헤더 — 가로 1줄 배치)</text>

  <!-- 헤더 4개 가로 컨트롤 박스 -->
  <rect x="50" y="102" width="206" height="38" rx="7" fill="#4f46e5" />
  <text x="153" y="118" text-anchor="middle" class="font-base badge-text">호스트 식별 배지</text>
  <text x="153" y="132" text-anchor="middle" class="font-base" style="font-size:10px; fill:#e0e7ff;">Vite :3000 / Rspack :3001</text>

  <rect x="268" y="102" width="218" height="38" rx="7" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2" />
  <text x="377" y="118" text-anchor="middle" class="font-base title-sm">사용자 전환 Select</text>
  <text x="377" y="132" text-anchor="middle" class="font-base body-xs">게스트(비로그인) / user-1 / user-2</text>

  <rect x="498" y="102" width="212" height="38" rx="7" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2" />
  <text x="604" y="118" text-anchor="middle" class="font-base title-sm">실시간 4종 테마 Select</text>
  <text x="604" y="132" text-anchor="middle" class="font-base body-xs">Indigo / Emerald / Rose / Dark</text>

  <rect x="722" y="102" width="188" height="38" rx="7" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2" />
  <text x="816" y="118" text-anchor="middle" class="font-base title-sm">1.5초 로딩 지연 토글</text>
  <text x="816" y="132" text-anchor="middle" class="font-base body-xs">simulateDelay ON / OFF</text>

  <!-- ===================================================================== -->
  <!-- 2단: DashboardWorkspace (Splitter 좌/우 분할) -->
  <!-- ===================================================================== -->
  <rect x="34" y="170" width="892" height="226" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="50" y="192" class="font-base title-lg">2. DashboardWorkspace (remote_shared/ui Splitter 좌/우 분할 영역)</text>

  <!-- 좌측 슬롯: remote-products -->
  <rect x="50" y="204" width="414" height="178" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2" />
  <text x="64" y="224" class="font-base title-sm">RemoteWidgetSlot (좌측)</text>

  <rect x="64" y="234" width="386" height="134" rx="7" fill="#fef2f2" stroke="#f87171" stroke-width="1.2" stroke-dasharray="5 3" />
  <text x="76" y="252" class="font-base" style="font-size:11px; font-weight:700; fill:#b91c1c;">RemoteErrorBoundary (순수 내장 폴백 + [다시 시도])</text>

  <rect x="76" y="262" width="362" height="94" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="88" y="280" class="font-base" style="font-size:11px; font-weight:700; fill:#b45309;">Suspense (fallback: Skeleton)</text>

  <rect x="88" y="290" width="338" height="54" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="257" y="313" text-anchor="middle" class="font-base title-md">ProductList (remote-products :3002)</text>
  <text x="257" y="331" text-anchor="middle" class="font-base body-xs">Vite 7 ESM (type: 'module') · React.lazy 지연 로딩</text>

  <!-- 중앙 Splitter 핸들 -->
  <rect x="474" y="204" width="12" height="178" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
  <circle cx="480" cy="283" r="2" fill="#64748b" />
  <circle cx="480" cy="293" r="2" fill="#64748b" />
  <circle cx="480" cy="303" r="2" fill="#64748b" />

  <!-- 우측 슬롯: remote-cart -->
  <rect x="496" y="204" width="414" height="178" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2" />
  <text x="510" y="224" class="font-base title-sm">RemoteWidgetSlot (우측)</text>

  <rect x="510" y="234" width="386" height="134" rx="7" fill="#fef2f2" stroke="#f87171" stroke-width="1.2" stroke-dasharray="5 3" />
  <text x="522" y="252" class="font-base" style="font-size:11px; font-weight:700; fill:#b91c1c;">RemoteErrorBoundary (순수 내장 폴백 + [다시 시도])</text>

  <rect x="522" y="262" width="362" height="94" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="534" y="280" class="font-base" style="font-size:11px; font-weight:700; fill:#b45309;">Suspense (fallback: Skeleton)</text>

  <rect x="534" y="290" width="338" height="54" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="703" y="313" text-anchor="middle" class="font-base title-md">CartWidget (remote-cart :3003)</text>
  <text x="703" y="331" text-anchor="middle" class="font-base body-xs">Rsbuild / Rspack Global (type: 'var') · React.lazy 지연 로딩</text>

  <!-- ===================================================================== -->
  <!-- 3단: MfeInspector (Collapsible + Tabs 실시간 학습 모니터) -->
  <!-- ===================================================================== -->
  <rect x="34" y="412" width="892" height="214" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5" />
  <text x="50" y="436" class="font-base title-lg">3. MfeInspector (Collapsible + Tabs 실시간 MFE 학습 모니터)</text>

  <!-- 모드 전환 스위치 필 -->
  <rect x="50" y="446" width="860" height="32" rx="7" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1" />
  <text x="66" y="466" class="font-base title-sm">상태 동기화 모드 전환 스위치 :</text>
  <rect x="244" y="451" width="292" height="22" rx="5" fill="#6d28d9" />
  <text x="390" y="466" text-anchor="middle" class="font-base badge-text">Mode A: 독립 QueryClient + CustomEvent</text>
  <text x="552" y="466" text-anchor="middle" class="font-base title-sm">↔</text>
  <rect x="568" y="451" width="328" height="22" rx="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2" />
  <text x="732" y="466" text-anchor="middle" class="font-base" style="font-size:11px; font-weight:700; fill:#5b21b6;">Mode B: 싱글톤 sharedQueryClient 직접 무효화</text>

  <!-- 탭 1: EventLogTab -->
  <rect x="50" y="490" width="422" height="122" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
  <rect x="50" y="490" width="422" height="28" rx="8" fill="#ddd6fe" />
  <text x="64" y="509" class="font-base title-sm">탭 1. EventLogTab (실시간 이벤트 로그)</text>
  <text x="64" y="538" class="font-base body-sm">• 4대 표준 이벤트 실시간 구독 (useMfeEvent)</text>
  <text x="74" y="555" class="font-base body-xs">CART_UPDATED · AUTH_CHANGED · THEME_CHANGED · SYNC_MODE_CHANGED</text>
  <text x="64" y="576" class="font-base body-sm">• 발신자 sourceId · 발생 시각 · 요약 표시 + [로그 비우기]</text>
  <text x="64" y="598" class="code-text">모델: MfeEventLogEntry[] (use-mfe-event-log.ts)</text>

  <!-- 탭 2: RuntimeStatusTab -->
  <rect x="488" y="490" width="422" height="122" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2" />
  <rect x="488" y="490" width="422" height="28" rx="8" fill="#ddd6fe" />
  <text x="502" y="509" class="font-base title-sm">탭 2. RuntimeStatusTab (런타임 · 캐시 상태)</text>
  <rect x="500" y="525" width="398" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="510" y="540" class="font-base body-sm">상단: 연결 리모트 3종 메타 카드 (3004 · 3002 · 3003)</text>
  <text x="510" y="555" class="code-text">모델: RemoteModuleDescriptor[]</text>
  <rect x="500" y="568" width="398" height="36" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="510" y="583" class="font-base body-sm">하단: sharedQueryClient 실시간 캐시 표 (Mode A: 0건 / Mode B: 활성)</text>
  <text x="510" y="598" class="code-text">모델: SharedQueryCacheEntrySnapshot[] (use-shared-query-cache.ts)</text>
</svg>

packages:
  - "apps/*"

# 멀티레포 간 싱글톤 및 다중 앱 공유 라이브러리 버전 드리프트(Version Drift) 방지를 위한 중앙 카탈로그
# (주의: api-server 전용인 express/cors/supertest 및 remote-shared에 캡슐화되는 @ark-ui/react, clsx 등 단일 앱 전용 패키지는 각 앱의 package.json에서 개별 관리)
catalog:
  # 1. MFE 런타임 싱글톤 필수 고정 패키지 (Host & Remote 전체 공유)
  react: ^19.1.0
  react-dom: ^19.1.0
  "@types/react": ^19.1.2
  "@types/react-dom": ^19.1.2
  "@tanstack/react-query": ^5.74.4

  # 2. 다중 앱 공통 표준 라이브러리 (스키마 검증 · 폼 · HTTP · 날짜 · 범용 유틸리티)
  zod: ^3.24.3
  react-hook-form: ^7.56.1
  "@hookform/resolvers": ^5.0.1
  ky: ^1.8.1
  date-fns: ^4.1.0
  es-toolkit: ^1.34.0

  # 3. 워크스페이스 공통 테스트 및 타입스크립트 도구
  vitest: ^3.0.5
  typescript: ^5.7.3
  msw: ^2.7.0
  "@testing-library/react": ^16.2.0
  "@testing-library/jest-dom": ^6.6.3
  "@testing-library/user-event": ^14.6.1
  jsdom: ^26.0.0
